version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - gocyclo
    - dupl
    - prealloc

  settings:
    gocyclo:
      min-complexity: 20

    dupl:
      threshold: 150

    gosec:
      excludes:
        - G202  # SQL string concatenation with validated placeholders

    gocritic:
      disabled-checks:
        - exitAfterDefer

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gosec
          - gocritic
          - noctx
      # Legacy migration code predates context-aware database calls.
      - path: internal/infra/migration/migration\.go
        linters:
          - noctx
      # Отключаем G202 для tickets_repo.go - используем валидированные placeholders
      - path: internal/infra/postgres/tickets_repo\.go
        linters:
          - gosec
        text: "G202"
      - linters:
          - gosec
        text: "G202.*SQL string concatenation"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
